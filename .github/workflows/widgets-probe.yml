name: widgets-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Собрать цифры по виджетам
        env:
          METRIKA_TOKEN: ${{ secrets.METRIKA_TOKEN }}
          COUNTER_ID: ${{ secrets.COUNTER_ID }}
        run: node widgets-probe.mjs
