<!doctype html><html><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Рендер постера карточки</title>
<style>html,body{margin:0;background:transparent}
model-viewer{width:1200px;height:900px;--poster-color:transparent;background:transparent}</style></head>
<body>
<!-- СЛУЖЕБНОЕ, шаг 1 из 2. Ставит модель в заданный ракурс; кадр снимает сам Chrome
     скриншотом, дальше его режет и жмёт _webp.html.
     Числа берутся из пульта _poster-lab.html и передаются в адресе:
     _render.html?src=models/m2.glb&orbit=0deg 30deg 62%&fov=27deg
     Снимать кадр изнутри страницы (toDataURL) НЕ ВЫШЛО: буфер WebGL к этому моменту
     очищен и канвас отдаёт пустоту, а круг через PNG+Image.decode не укладывается
     в виртуальное время headless. Скриншот Chrome берёт уже скомпонованный кадр.
     Флаги запуска: --headless=new --use-gl=angle --use-angle=swiftshader
     --enable-unsafe-swiftshader --default-background-color=00000000 (альфа)
     --virtual-time-budget=120000 --window-size=1200,900 -->
<model-viewer id="mv" loading="eager" reveal="auto" interaction-prompt="none"
  disable-tap disable-pan disable-zoom shadow-intensity="0" exposure="1.0"
  environment-image="https://modelviewer.dev/shared-assets/environments/lightroom_14b.hdr"
  min-camera-orbit="auto auto 1%" max-camera-orbit="auto auto 900%"
  camera-target="auto auto auto"></model-viewer>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const mv = document.getElementById('mv');
  mv.setAttribute('camera-orbit', q.get('orbit') || '0deg 38deg 150%');
  mv.setAttribute('field-of-view', q.get('fov') || '36deg');
  if (q.get('exp')) mv.setAttribute('exposure', q.get('exp'));
  mv.src = q.get('src');
</script>
</body></html>
