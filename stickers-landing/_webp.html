<!doctype html><html><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Кадр → постер карточки</title></head>
<body>
<!-- СЛУЖЕБНОЕ, шаг 2 из 2. Берёт снятый кадр 4:3, повторяет «масштаб в кадре» из пульта
     центральным кропом 1/scale и отдаёт webp 584×438 с альфой — формат нынешних
     models/card-*.webp. Кроп, а не зум камеры: в карточке scale это CSS-увеличение
     с обрезкой по краям, зумом уехала бы перспектива.
     Адрес: _webp.html?src=_tmp/card-m2.png&scale=1.08&sat=1.2
     sat — насыщенность (24.08). Только попиксельный фильтр: пространственные (нерезкая маска)
     10.08 дали ореол вокруг стикера на гладкой подложке, повторять нельзя.
     Результат кладётся в textContent (у textarea value в дамп DOM не попадает). -->
<textarea id="out" style="position:fixed;left:-9999px"></textarea>
<script>
  const q = new URLSearchParams(location.search);
  const W = 584, H = 438, k = +(q.get('scale') || 1);
  const img = new Image();
  img.onload = () => {
    const sw = img.width / k, sh = img.height / k;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');
    if (q.get('sat')) ctx.filter = `saturate(${q.get('sat')})`;
    ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, W, H);
    document.getElementById('out').textContent = c.toDataURL('image/webp', 0.92);
    document.title = 'READY';
  };
  img.onerror = () => { document.title = 'ERROR'; };
  img.src = q.get('src');
</script>
</body></html>
