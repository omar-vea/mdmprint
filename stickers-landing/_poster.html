<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
model-viewer{width:1200px;height:900px;--poster-color:transparent;background:transparent}
</style></head><body>
<model-viewer id="mv" loading="eager" reveal="auto" interaction-prompt="none"
  disable-tap disable-pan disable-zoom shadow-intensity="0" exposure="1.0"
  environment-image="https://modelviewer.dev/shared-assets/environments/lightroom_14b.hdr"
  field-of-view="60deg" camera-orbit="-20deg 44deg 175%"
  min-camera-orbit="auto auto 30%" max-camera-orbit="auto auto 900%"
  camera-target="auto auto auto"></model-viewer>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<script>
  const src = new URLSearchParams(location.search).get('src');
  const mv = document.getElementById('mv');
  mv.src = src;
  mv.addEventListener('load', ()=>{ document.title = 'READY'; });
</script></body></html>
